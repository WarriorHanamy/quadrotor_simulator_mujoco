[project]
name = "quadrotor-sim"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = ["pydantic>=2.0"]

[project.scripts]
sim = "quadrotor_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/quadrotor_sim"]
